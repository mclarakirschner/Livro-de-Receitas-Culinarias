<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receitas</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Sweet Alert -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.24.0/dist/sweetalert2.all.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.24.0/dist/sweetalert2.min.css">

  <!-- Material Symbols do Google -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />


  <!-- Fontes google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Momo+Signature&display=swap" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Momo+Signature&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
    rel="stylesheet">

</head>

<body class="bg-orange-100 min-h-screen flex flex-col">

  <!-- Cabeçalho -->
  <header class="bg-amber-600 text-white p-4 flex items-center justify-between shadow-md">
    <img src="images/livro.png" alt="Logo do site" class="h-16" />
    <h1 class="text-xl font-light" style="font-family: 'Momo Signature', cursive;">
      Livro de Receitas Virtual</h1>

    <div class="flex items-center">


      <a href="categorias.html" class="mr-4 flex items-center gap-1" style="font-family: 'Nunito', sans-serif;">
        <span class="material-symbols-outlined">
          grocery
        </span>
        Categorias</a>


      <a href="menu.html" class="mr-4 flex items-center gap-1" style="font-family: 'Nunito', sans-serif;">
        <span class="material-symbols-outlined">
          menu_book
        </span>Menu</a>

      <button id="btnLogout" class="bg-green-700 px-3 py-1 rounded flex items-center justify-center hover:bg-green-800" style="font-family: 'Nunito', sans-serif;">
        <span class="material-symbols-outlined mr-1">logout</span>Logout
      </button>
    </div>
  </header>

  <!-- Conteúdo -->
  <h2 class="text-2xl text-amber-800 font-normal mb-6 text-center mt-8" style="font-family: 'Momo Signature', cursive;">
    Guarde sua receita aqui!
  </h2>


  <!-- 2 Colunas -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">

    <!-- Formulário -->
    <div class="bg-orange-200 bg-opacity-90 p-6 rounded-2xl shadow-lg">
      <h3 class="text-lg text-orange-900 font-light mb-4" style="font-family: 'Momo Signature', cursive;">Nova Receita
      </h3>

      <form id="formReceita" class="space-y-4">

        <div>
          <label for="titulo" class="block text-sm text-orange-800 font-semibold"
            style="font-family: 'Nunito', sans-serif;">
            Título :</label>
          <input id="titulo" type="text" placeholder="Ex: Bolo de Chocolate" required
            class="border border-orange-400 p-2 w-full rounded-md">
        </div>

        <div>
          <label for="categoria_id" class="block text-sm text-orange-800 font-semibold"
            style="font-family: 'Nunito', sans-serif;">
            Categoria :</label>
          <select id="categoria_id" required class="border text-gray-500 border-orange-400 p-2 w-full mt-1 rounded-md">
            <option value="" disabled selected>Selecione a categoria :</option>
          </select>
        </div>

        <div>
          <label for="ingredientes" class="block text-sm text-orange-800 font-semibold"
            style="font-family: 'Nunito', sans-serif;">
            Ingredientes :</label>
          <input id="ingredientes" type="text" placeholder="Ex: Cenoura, Açúcar, Ovos..." required
            class="border text-gray-500 border-orange-400 p-2 w-full mt-1 rounded-md">
        </div>

        <div>
          <label for="preparo" class="block text-sm text-orange-800 font-semibold"
            style="font-family: 'Nunito', sans-serif;">
            Modo de Preparo :</label>
          <textarea id="preparo" rows="3" placeholder="Descreva o modo de preparo..." required
            class="border text-gray-500 border-orange-400 p-2 w-full mt-1 rounded-md"></textarea>
        </div>

        <div class="flex gap-4">
          <div class="flex-1">
            <label for="data_criacao" class="block text-sm text-orange-800 font-semibold"
              style="font-family: 'Nunito', sans-serif;">
              Data da criação :</label>
            <input id="data_criacao" type="date" placeholder="dd/mm/aaaa" required
              title="Informe a data que criou a receita"
              class="border text-gray-500 border-orange-400 p-2 w-full mt-1 rounded-md">
          </div>
        </div>


        <!-- Botões -->
        <div class="flex gap-4 pt-2">
          <button type="submit"
            class="bg-green-700 hover:bg-green-800 text-white px-4 py-2 w-full rounded-md flex items-center justify-center gap-1">
            <span class="material-symbols-outlined">
              check
            </span>Salvar
          </button>

          <button type="reset"
            class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 w-full rounded-md flex items-center justify-center gap-1">
            <span class="material-symbols-outlined">
              delete
            </span>Limpar
          </button>
        </div>
      </form>
    </div>

    <!-- Tabela -->
    <div class="bg-white p-6 rounded-2xl shadow-lg">
      <h3 class="text-lg text-amber-800 font-light mb-4" style="font-family: 'Momo Signature', cursive;">Receitas
        Cadastradas</h3>

      <table class="w-full border border-orange-300 rounded-lg overflow-hidden">
        <thead class="bg-amber-200">
          <tr>
            <th class="border p-2 text-orange-900">Categoria</th>
            <th class="border p-2 text-orange-900">Título</th>
            <th class="border p-2 text-orange-900">Ingredientes</th>
            <th class="border p-2 text-orange-900">Preparo</th>
            <th class="border p-2 text-orange-900">Data da Criação</th>
            <th class="border p-2 text-orange-900">Opções</th>
          </tr>
        </thead>
        <tbody id="tabelaReceitas" class="text-center">
          <tr>
            <td colspan="5" class="bg-orange-50 text-orange-600 p-4">Nenhuma receita foi cadastrada ainda!</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  </main>

  <!-- Rodapé -->
  <footer class="w-full bg-green-900 text-white text-center py-3 mt-10">
    <p class="text-sm">© 2025 Receitas Culinárias </p>
  </footer>

  <script src="js/mainReceitas.js" type="module"></script>
</body>

</html>
