<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorias - Culina Recipes</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Sweet Alert -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.24.0/dist/sweetalert2.all.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.24.0/dist/sweetalert2.min.css">

  <!-- Material Symbols do Google -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

      <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Momo+Signature&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
    rel="stylesheet">
    
</head>

<body class="bg-orange-100 h-screen flex flex-col">

  <header class="bg-amber-600 text-white p-4 flex items-center justify-between">
    <img src="images/logo.png" alt="Logo" class="h-16" />

    <h1 class="text-xl font-light" style="font-family: 'Momo Signature', cursive;">Categorias das receitas - Culina Recipes</h1>

    <div class="flex items-center">

      <a href="receitas.html" class="mr-4 flex items-center gap-1" style="font-family: 'Nunito', sans-serif;">
        <span class="material-symbols-outlined">
          chef_hat
        </span>
        Receitas
      </a>


      <a href="menu.html" class="mr-4 hover:text-orange-200 flex items-center gap-1" style="font-family: 'Nunito', sans-serif;">
        <span class="material-symbols-outlined" >
          menu_book
        </span>
        Menu</a>

      <button id="btnLogout"
        class="bg-green-700 px-3 py-1 rounded flex items-center justify-center hover:bg-green-800 gap-1" style="font-family: 'Nunito', sans-serif;">
        <span class="material-symbols-outlined mr-1">logout</span>
        Logout
      </button>
    </div>
  </header>

  <main>
    <table class="w-1/2 border bg-white shadow-lg mx-auto">
      <caption class="text-2xl text-amber-900 font-semibold my-4 caption-top" style="font-family: 'Momo Signature', cursive;">Listagem das Categorias</caption>
      <thead>
        <tr class="bg-orange-300 text-amber-700">
          <th class="border border-orange-400 p-2">Descrição</th>
        </tr>
      </thead>

      <tbody id="tabelaCategorias">
        <tr>
          <td colspan="2" class="bg-green-900 text-white p-4 ">Ainda não há nenhuma categoria cadastrada!</td>
        </tr>
      </tbody>

    </table>
  </main>

  <!-- Rodapé -->
  <footer class="w-full bg-green-900 text-white text-center py-3 mt-10">
    <p class="text-sm">© 2025 Receitas Culinárias </p>
  </footer>

</body>
<script src="js/mainCategorias.js" type="module"></script>

</html>
