<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Usuário - Livro de Receitas</title>
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Sweet Alert -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.24.0/dist/sweetalert2.all.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.24.0/dist/sweetalert2.min.css">
</head>

<body class="bg-orange-200 min-h-screen flex flex-col items-center justify-center">
  <div>
    <img src="images/livro.png" alt="Logo Livro de Receitas" class="h-60">
  </div>

  <div class="bg-amber-50 bg-opacity-90 p-8 rounded-2xl shadow-xl w-80 backdrop-blur-sm text-center mb-20">
    <div class="flex justify-center mb-8">
      <img src="images/novoUser.svg" alt="Novo Usuário" class="h-32">
    </div>

    <h1 class="text-xl mb-4 text-orange-800 font-semibold">Criar Novo Usuário</h1>

    <form id="formSignup">
      <input id="email" type="email" placeholder="Informe o seu Email" required
        class="border p-2 w-full mb-2 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400">

      <input id="password" type="password" placeholder="Crie uma Senha" required
        class="border p-2 w-full mb-2 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400">

      <button type="submit"
        class="bg-orange-800 hover:bg-orange-900 text-white px-4 py-2 mt-4 w-full rounded-md transition duration-200">
        Cadastrar
      </button>

      <a href="index.html" class="block text-center mt-3 text-sm text-green-900 font-medium hover:underline">
        Efetuar Login
      </a>
    </form>
  </div>

  <script src="js/mainSignUp.js" type="module"></script>
</body>

</html>
